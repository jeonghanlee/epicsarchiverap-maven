[book]
title = "EPICS Archiver Appliance"
authors = ["EPICS Archiver Appliance contributors"]
description = "Documentation for the EPICS Archiver Appliance, built and deployed by this project."
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/jeonghanlee/epicsarchiverap-maven"
site-url = "/epicsarchiverap-maven/"
edit-url-template = "https://github.com/jeonghanlee/epicsarchiverap-maven/edit/master/docs/book/{path}"
