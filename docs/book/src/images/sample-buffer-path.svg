<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" width="780" height="640" role="img" aria-labelledby="t d">
<title id="t">The path of an event through the sample buffer</title>
<desc id="d">A MONITOR event passes the timestamp check, enters the sample buffer, and at each write period the buffer is swapped and written to the short term store. A sample is lost for a wrong timestamp, a type change or a full buffer.</desc>
<rect x="0.5" y="0.5" width="779" height="639" rx="6" fill="#ffffff" stroke="#c8ced4"/>
<text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="30" dy="0">The path of an event of a MONITOR PV</tspan></text><rect x="30" y="56" width="340" height="70" rx="5" fill="#f3f6fa" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="42" y="78" font-size="14.5" font-weight="bold" fill="#1b1b1b" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="42" dy="0">1  The IOC updates the PV</tspan></text><text x="42" y="98" font-size="12.5" font-weight="normal" fill="#44505c" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="42" dy="0">Every change reaches the engine. The</tspan></text><text x="42" y="115" font-size="13" font-weight="normal" fill="#1b1b1b" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="42" dy="0">sampling period does not filter events.</tspan></text><rect x="30" y="162" width="340" height="88" rx="5" fill="#f3f6fa" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="42" y="184" font-size="14.5" font-weight="bold" fill="#1b1b1b" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="42" dy="0">2  Timestamp check</tspan></text><text x="42" y="204" font-size="12.5" font-weight="normal" fill="#44505c" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="42" dy="0">ArchiveChannel.addValueToBuffer</tspan></text><text x="42" y="221" font-size="13" font-weight="normal" fill="#1b1b1b" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="42" dy="0">A sample passes if its time is in range</tspan><tspan x="42" dy="17">and later than the previous sample.</tspan></text><rect x="30" y="286" width="340" height="88" rx="5" fill="#f3f6fa" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="42" y="308" font-size="14.5" font-weight="bold" fill="#1b1b1b" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="42" dy="0">3  Sample buffer</tspan></text><text x="42" y="328" font-size="12.5" font-weight="normal" fill="#44505c" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="42" dy="0">SampleBuffer.add</tspan></text><text x="42" y="345" font-size="13" font-weight="normal" fill="#1b1b1b" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="42" dy="0">Holds as many samples as it has slots</tspan><tspan x="42" dy="17">(the capacity). Accepts the sample.</tspan></text><rect x="30" y="410" width="340" height="106" rx="5" fill="#f3f6fa" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="42" y="432" font-size="14.5" font-weight="bold" fill="#1b1b1b" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="42" dy="0">4  Swap at each write period</tspan></text><text x="42" y="452" font-size="12.5" font-weight="normal" fill="#44505c" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="42" dy="0">samplesToWrite (10 s by default)</tspan></text><text x="42" y="469" font-size="13" font-weight="normal" fill="#1b1b1b" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="42" dy="0">A buffer that holds samples becomes the</tspan><tspan x="42" dy="17">batch to write; an empty one is skipped.</tspan><tspan x="42" dy="17">New samples go to a new empty buffer.</tspan></text><rect x="30" y="552" width="340" height="70" rx="5" fill="#f3f6fa" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="42" y="574" font-size="14.5" font-weight="bold" fill="#1b1b1b" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="42" dy="0">5  Write to the short term store</tspan></text><text x="42" y="594" font-size="12.5" font-weight="normal" fill="#44505c" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="42" dy="0">Writer.appendData. If it fails, the same</tspan></text><text x="42" y="611" font-size="13" font-weight="normal" fill="#1b1b1b" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="42" dy="0">batch is tried again at the next write.</tspan></text><line x1="200" y1="126" x2="200" y2="156" stroke="#3b4a5a" stroke-width="1.8"/><polygon points="195,155 205,155 200,162" fill="#3b4a5a"/>
<line x1="200" y1="250" x2="200" y2="280" stroke="#3b4a5a" stroke-width="1.8"/><polygon points="195,279 205,279 200,286" fill="#3b4a5a"/>
<line x1="200" y1="374" x2="200" y2="404" stroke="#3b4a5a" stroke-width="1.8"/><polygon points="195,403 205,403 200,410" fill="#3b4a5a"/>
<line x1="200" y1="516" x2="200" y2="546" stroke="#3b4a5a" stroke-width="1.8"/><polygon points="195,545 205,545 200,552" fill="#3b4a5a"/>
<rect x="420" y="162" width="340" height="88" rx="5" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="432" y="184" font-size="14" font-weight="bold" fill="#8c1a14" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="432" dy="0">Lost: wrong timestamp</tspan></text><text x="432" y="202" font-size="12.5" font-weight="normal" fill="#8c1a14" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="432" dy="0">Too far from the server clock (1800 s by</tspan><tspan x="432" dy="16">default), earlier than the previous sample,</tspan><tspan x="432" dy="16">or equal to it. An equal one is not counted.</tspan></text><rect x="420" y="286" width="340" height="58" rx="5" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="432" y="308" font-size="14" font-weight="bold" fill="#8c1a14" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="432" dy="0">Lost: type change</tspan></text><text x="432" y="326" font-size="12.5" font-weight="normal" fill="#8c1a14" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="432" dy="0">The type differs from the archived one.</tspan></text><rect x="420" y="354" width="340" height="66" rx="5" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="432" y="376" font-size="14" font-weight="bold" fill="#8c1a14" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="432" dy="0">Lost: buffer full</tspan></text><text x="432" y="394" font-size="12.5" font-weight="normal" fill="#8c1a14" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="432" dy="0">Every slot is taken: the oldest sample</tspan><tspan x="432" dy="16">is pushed out and counted as lost.</tspan></text><line x1="370" y1="206" x2="420" y2="206" stroke="#b3261e" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="370" y1="306" x2="420" y2="306" stroke="#b3261e" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="370" y1="364" x2="420" y2="364" stroke="#b3261e" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="420" y="470" font-size="12.5" font-weight="normal" fill="#44505c" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="420" dy="0">Red boxes mark the three places where an</tspan><tspan x="420" dy="17">event can be lost. Each cause has its own</tspan><tspan x="420" dy="17">counter in the engine.</tspan></text></svg>
