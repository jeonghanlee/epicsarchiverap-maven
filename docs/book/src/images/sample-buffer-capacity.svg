<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 342" width="780" height="342" role="img" aria-labelledby="t d">
<title id="t">The capacity of the sample buffer for a sampling period</title>
<desc id="d">The number of slots is the samples expected in one write period plus a margin of one second. A 1.0 s period gives 10 plus 1, 11 slots. A 0.1 s period gives 100 plus 10, 110 slots.</desc>
<rect x="0.5" y="0.5" width="779" height="341" rx="6" fill="#ffffff" stroke="#c8ced4"/>
<text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="30" dy="0">How many slots a PV gets</tspan></text><text x="30" y="62" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="30" dy="0">slots = expected samples + margin</tspan></text><text x="30" y="82" font-size="12.5" font-weight="normal" fill="#44505c" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="30" dy="0">expected = write period ÷ sampling period, rounded, at least 1</tspan><tspan x="30" dy="17">margin = margin seconds ÷ sampling period, rounded up, at least 1</tspan></text><text x="30" y="134" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="30" dy="0">Sampling period 1.0 s: 10 expected + 1 margin = 11 slots</tspan></text><rect x="30" y="142" width="58.18181818181819" height="30" rx="5" fill="#f3f6fa" stroke="#3b4a5a" stroke-width="1.5"/>
<rect x="88.18181818181819" y="142" width="5.818181818181818" height="30" rx="5" fill="#fff1d6" stroke="#8a5a00" stroke-width="1.5"/>
<text x="30" y="218" font-size="14" font-weight="bold" fill="#1b1b1b" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="30" dy="0">Sampling period 0.1 s: 100 expected + 10 margin = 110 slots</tspan></text><rect x="30" y="226" width="581.8181818181819" height="30" rx="5" fill="#f3f6fa" stroke="#3b4a5a" stroke-width="1.5"/>
<rect x="611.8181818181819" y="226" width="58.18181818181819" height="30" rx="5" fill="#fff1d6" stroke="#8a5a00" stroke-width="1.5"/>
<rect x="30" y="282" width="16" height="16" rx="5" fill="#f3f6fa" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="54" y="295" font-size="12.5" font-weight="normal" fill="#1b1b1b" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="54" dy="0">Samples expected in one write period</tspan></text><rect x="310" y="282" width="16" height="16" rx="5" fill="#fff1d6" stroke="#8a5a00" stroke-width="1.5"/>
<text x="334" y="295" font-size="12.5" font-weight="normal" fill="#1b1b1b" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="334" dy="0">Margin of 1 s, so a write that is late by up to 1 s loses nothing</tspan></text><text x="30" y="324" font-size="12.5" font-weight="normal" fill="#44505c" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="30" dy="0">Defaults: write period 10 s (secondsToBuffer), margin 1 s (sampleBufferMarginSeconds). The bars share one scale.</tspan></text></svg>
