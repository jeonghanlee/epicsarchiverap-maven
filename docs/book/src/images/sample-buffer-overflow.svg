<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 344" width="780" height="344" role="img" aria-labelledby="t d">
<title id="t">Which samples are kept when the buffer overflows</title>
<desc id="d">Twenty samples arrive between two writes into a buffer of 11 slots. The oldest 9 are pushed out and counted as buffer-full losses, and the newest 11 are written. Losses start above the capacity divided by the write period.</desc>
<rect x="0.5" y="0.5" width="779" height="343" rx="6" fill="#ffffff" stroke="#c8ced4"/>
<text x="30" y="34" font-size="17" font-weight="bold" fill="#1b1b1b" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="30" dy="0">Twenty samples arrive between two writes, the buffer has 11 slots</tspan></text><text x="30" y="66" font-size="13" font-weight="bold" fill="#1b1b1b" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="30" dy="0">Samples in the order of arrival</tspan></text><rect x="30" y="78" width="30" height="30" rx="5" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="45.0" y="98" font-size="12.5" font-weight="bold" fill="#8c1a14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"><tspan x="45.0" dy="0">1</tspan></text><rect x="62" y="78" width="30" height="30" rx="5" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="77.0" y="98" font-size="12.5" font-weight="bold" fill="#8c1a14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"><tspan x="77.0" dy="0">2</tspan></text><rect x="94" y="78" width="30" height="30" rx="5" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="109.0" y="98" font-size="12.5" font-weight="bold" fill="#8c1a14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"><tspan x="109.0" dy="0">3</tspan></text><rect x="126" y="78" width="30" height="30" rx="5" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="141.0" y="98" font-size="12.5" font-weight="bold" fill="#8c1a14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"><tspan x="141.0" dy="0">4</tspan></text><rect x="158" y="78" width="30" height="30" rx="5" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="173.0" y="98" font-size="12.5" font-weight="bold" fill="#8c1a14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"><tspan x="173.0" dy="0">5</tspan></text><rect x="190" y="78" width="30" height="30" rx="5" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="205.0" y="98" font-size="12.5" font-weight="bold" fill="#8c1a14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"><tspan x="205.0" dy="0">6</tspan></text><rect x="222" y="78" width="30" height="30" rx="5" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="237.0" y="98" font-size="12.5" font-weight="bold" fill="#8c1a14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"><tspan x="237.0" dy="0">7</tspan></text><rect x="254" y="78" width="30" height="30" rx="5" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="269.0" y="98" font-size="12.5" font-weight="bold" fill="#8c1a14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"><tspan x="269.0" dy="0">8</tspan></text><rect x="286" y="78" width="30" height="30" rx="5" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="301.0" y="98" font-size="12.5" font-weight="bold" fill="#8c1a14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"><tspan x="301.0" dy="0">9</tspan></text><rect x="318" y="78" width="30" height="30" rx="5" fill="#e8f3ec" stroke="#1d6b3a" stroke-width="1.5"/>
<text x="333.0" y="98" font-size="12.5" font-weight="bold" fill="#14502a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"><tspan x="333.0" dy="0">10</tspan></text><rect x="350" y="78" width="30" height="30" rx="5" fill="#e8f3ec" stroke="#1d6b3a" stroke-width="1.5"/>
<text x="365.0" y="98" font-size="12.5" font-weight="bold" fill="#14502a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"><tspan x="365.0" dy="0">11</tspan></text><rect x="382" y="78" width="30" height="30" rx="5" fill="#e8f3ec" stroke="#1d6b3a" stroke-width="1.5"/>
<text x="397.0" y="98" font-size="12.5" font-weight="bold" fill="#14502a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"><tspan x="397.0" dy="0">12</tspan></text><rect x="414" y="78" width="30" height="30" rx="5" fill="#e8f3ec" stroke="#1d6b3a" stroke-width="1.5"/>
<text x="429.0" y="98" font-size="12.5" font-weight="bold" fill="#14502a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"><tspan x="429.0" dy="0">13</tspan></text><rect x="446" y="78" width="30" height="30" rx="5" fill="#e8f3ec" stroke="#1d6b3a" stroke-width="1.5"/>
<text x="461.0" y="98" font-size="12.5" font-weight="bold" fill="#14502a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"><tspan x="461.0" dy="0">14</tspan></text><rect x="478" y="78" width="30" height="30" rx="5" fill="#e8f3ec" stroke="#1d6b3a" stroke-width="1.5"/>
<text x="493.0" y="98" font-size="12.5" font-weight="bold" fill="#14502a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"><tspan x="493.0" dy="0">15</tspan></text><rect x="510" y="78" width="30" height="30" rx="5" fill="#e8f3ec" stroke="#1d6b3a" stroke-width="1.5"/>
<text x="525.0" y="98" font-size="12.5" font-weight="bold" fill="#14502a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"><tspan x="525.0" dy="0">16</tspan></text><rect x="542" y="78" width="30" height="30" rx="5" fill="#e8f3ec" stroke="#1d6b3a" stroke-width="1.5"/>
<text x="557.0" y="98" font-size="12.5" font-weight="bold" fill="#14502a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"><tspan x="557.0" dy="0">17</tspan></text><rect x="574" y="78" width="30" height="30" rx="5" fill="#e8f3ec" stroke="#1d6b3a" stroke-width="1.5"/>
<text x="589.0" y="98" font-size="12.5" font-weight="bold" fill="#14502a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"><tspan x="589.0" dy="0">18</tspan></text><rect x="606" y="78" width="30" height="30" rx="5" fill="#e8f3ec" stroke="#1d6b3a" stroke-width="1.5"/>
<text x="621.0" y="98" font-size="12.5" font-weight="bold" fill="#14502a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"><tspan x="621.0" dy="0">19</tspan></text><rect x="638" y="78" width="30" height="30" rx="5" fill="#e8f3ec" stroke="#1d6b3a" stroke-width="1.5"/>
<text x="653.0" y="98" font-size="12.5" font-weight="bold" fill="#14502a" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"><tspan x="653.0" dy="0">20</tspan></text><text x="30" y="134" font-size="12.5" font-weight="normal" fill="#8c1a14" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="30" dy="0">1 to 9: pushed out, one at a time,</tspan><tspan x="30" dy="16">each by the sample that found the buffer full</tspan></text><text x="318" y="134" font-size="12.5" font-weight="normal" fill="#14502a" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="318" dy="0">10 to 20: the newest 11 stay in the buffer</tspan><tspan x="318" dy="16">and are written at the next swap</tspan></text><text x="30" y="208" font-size="13.5" font-weight="normal" fill="#1b1b1b" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="30" dy="0">The 9 samples that were pushed out are counted as buffer-full losses.</tspan></text><text x="30" y="238" font-size="13.5" font-weight="bold" fill="#1b1b1b" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="30" dy="0">Losses start when more than capacity ÷ write period updates arrive per second:</tspan></text><text x="30" y="262" font-size="13" font-weight="normal" fill="#1b1b1b" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="30" dy="0">Sampling period 1.0 s, 11 slots: above 1.1 updates per second.</tspan><tspan x="30" dy="19">Sampling period 0.1 s, 110 slots: above 11 updates per second.</tspan></text><text x="30" y="312" font-size="12.5" font-weight="normal" fill="#44505c" text-anchor="start" font-family="Helvetica, Arial, sans-serif"><tspan x="30" dy="0">A burst that exceeds the capacity within one write period gives the same result.</tspan></text></svg>
