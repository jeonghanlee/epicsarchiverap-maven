version: 2

build:
  os: "ubuntu-26.04"
  apt_packages:
    - openjdk-21-jdk
  tools:
    python: "3.10"
  jobs:
    pre_build:
      - JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 ./mvnw -B -q compile javadoc:javadoc
      - test -s target/site/apidocs/index.html

python:
  install:
    - requirements: docs/docs/requirements.txt

sphinx:
  configuration: docs/docs/source/conf.py
