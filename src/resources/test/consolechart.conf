# ioc-runner configuration (local mode) of the one soft IOC of the console checks, which runs st.cmd of this folder.
# Replace each <value> and install the file with ioc-runner; the developer guide of the book, section
# "Run the test IOC of the console checks", gives the steps. RECORD_CHANGE and the CAV2_* macros of st.cmd are set here.
IOC_USER="<user>"
IOC_GROUP="<group>"
IOC_CHDIR="<repository>/src/resources/test"
IOC_PORT=""
IOC_CMD="./st.cmd"
PATH=<epics_pvxs_bin>:/usr/local/bin:/usr/bin:/bin
EPICS_CA_SERVER_PORT=<ca_port>
EPICS_CA_REPEATER_PORT=<ca_repeater_port>
EPICS_CA_ADDR_LIST=127.0.0.1
EPICS_CA_AUTO_ADDR_LIST=NO
EPICS_PVA_ADDR_LIST=127.0.0.1
EPICS_PVA_AUTO_ADDR_LIST=NO
RECORD_CHANGE=
